apiVersion: v1
kind: Pod
metadata:
  name: helper-pod
spec:
  containers:
    - name: helper
      image: busybox
      command: ["sleep", "3600"]
      volumeMounts:
        - name: model-vol
          mountPath: /mnt/models
  volumes:
    - name: model-vol
      persistentVolumeClaim:
        claimName: my-model-pvc
